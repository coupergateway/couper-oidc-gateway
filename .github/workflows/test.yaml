name: 'chrome-test'

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**/README.md'
  pull_request:
  schedule:
    - cron: '0 9 * * 1-5' # mo-fr
  workflow_call:

jobs:
  docker:
    name: 'chrome-test'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: 'setup go'
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: 'setup go dep'
        run: go mod download
      - uses: hoverkraft-tech/compose-action@v2.0.1
        with:
          compose-file: "./test/docker-compose.yml"
      - name: 'test with coupergateway/couper'
        run: |
          docker version
          go test -v -race -timeout 30s main_test.go
